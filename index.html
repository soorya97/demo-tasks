<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Tasks</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#7a8296; --accent:#4f6df5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151d; --card:#1b202c; --text:#e8ebf3; --muted:#8c94a8; --accent:#7b91ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:480px; }
  h1 { margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:12px; border-radius:10px; border:1px solid #0002;
                     background:var(--card); color:var(--text); font-size:16px; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent);
           color:#fff; font-size:16px; cursor:pointer; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { display:flex; align-items:center; gap:10px; background:var(--card); padding:12px;
       border-radius:10px; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li span { flex:1; }
  li button { background:none; color:var(--muted); padding:4px 8px; }
  .count { margin-top:16px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Demo Tasks</h1>
  <p class="sub">A tiny task list. Saved in your browser.</p>
  <form id="f"><input id="t" type="text" placeholder="Add a task…" autocomplete="off" required><button>Add</button></form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</main>
<script>
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem('tasks') || '[]'); } catch (e) {}
  const save = () => { try { localStorage.setItem('tasks', JSON.stringify(tasks)); } catch (e) {} };
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      if (task.done) li.className = 'done';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = task.done;
      cb.onchange = () => { task.done = cb.checked; save(); render(); };
      const sp = document.createElement('span'); sp.textContent = task.text;
      const del = document.createElement('button'); del.textContent = '✕';
      del.onclick = () => { tasks.splice(i, 1); save(); render(); };
      li.append(cb, sp, del); list.append(li);
    });
    const left = tasks.filter(t => !t.done).length;
    document.getElementById('count').textContent = tasks.length ? left + ' of ' + tasks.length + ' remaining' : 'Nothing yet — add one!';
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById('t');
    tasks.push({ text: inp.value.trim(), done: false });
    inp.value = ''; save(); render();
  };
  render();
</script>
</body>
</html>
